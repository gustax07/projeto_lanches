<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/login.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <title>Login</title>
</head>

<body>
  <div class="login">
    <div class="header-backgroud"></div>
    <div class="login-wrapper">

      <div class="login-box">
        <div class="col-2">
          <button class="btn-back" onclick="window.history.back()" type="button"><i
              class="bi bi-arrow-left"></i></button>
        </div>
        <h2 class="login-header">Criar Conta</h2>

        <form method="post" action="./actions/clientes/cadastrar_clientes.php">

          <div class="group">
            <label>Nome completo</label>
            <input type="text" name="nome" id="nome" placeholder="Seu nome completo" required>
          </div>

          <div class="group">
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="seu@email.com" required>
          </div>

          <div class="group">
            <label>Senha</label>
            <input type="password" name="senha" id="senha" placeholder="••••••••" required>
          </div>

          <div class="captcha-box">
            <div class="g-recaptcha" data-sitekey="6LfOn3csAAAAAHV9Lm0HQia3ZfqKu4jEuiqKfans"></div>
          </div>

          <button type="submit" class="btn-submit">Cadastrar</button>
        </form>
        <a class="link" href="logar.html">Já tem uma conta ? Faça login</a>
      </div>
    </div>
  </div>
</body>

</html>
